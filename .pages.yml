# Configurazione del pannello Pages CMS (https://app.pagescms.org).
# Descrive cosa Giada può modificare e con quali campi. I nomi dei campi devono
# coincidere con gli schemi in src/content.config.ts: se uno cambia, va cambiato anche l'altro.

media:
  - name: lavori
    label: Foto dei lavori
    input: src/assets/lavori
    # Percorso relativo ai file in src/content/lavori, come lo vuole Astro
    output: ../../assets/lavori
    categories: [image]
    rename: safe
  - name: notizie
    label: Immagini delle notizie
    input: src/assets/notizie
    output: ../../assets/notizie
    categories: [image]
    rename: safe

content:
  - name: lavori
    label: Lavori
    description: Compaiono sulla mappa e nell'elenco dei lavori.
    type: collection
    path: src/content/lavori
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [titolo, citta, data, bozza]
      primary: titolo
      sort: [data, titolo]
      default: { sort: data, order: desc }
    fields:
      - { name: titolo, label: Titolo, type: string, required: true }
      - { name: data, label: Data, type: date, required: true }
      - { name: citta, label: Città, type: string, required: true }
      - name: lat
        label: Latitudine
        description: "Su Google Maps: tasto destro sul punto, il primo numero (es. 44.4949)."
        type: number
        required: true
        options: { min: 35, max: 48, step: 0.0001 }
      - name: lng
        label: Longitudine
        description: "Il secondo numero (es. 11.3426)."
        type: number
        required: true
        options: { min: 6, max: 19, step: 0.0001 }
      - name: servizio
        label: Servizio
        type: select
        required: true
        options:
          values:
            - { value: conto-termico, label: Conto Termico }
            - { value: detrazioni, label: Detrazioni fiscali }
            - { value: progettazione, label: Progettazione impianti }
            - { value: interior, label: Interior design }
            - { value: garden, label: Garden design }
      - name: foto
        label: Foto
        type: object
        list: true
        fields:
          - { name: src, label: Immagine, type: image, required: true, options: { media: lavori } }
          - { name: alt, label: Cosa si vede nella foto, description: "Una frase breve, serve a chi non vede l'immagine.", type: string, required: true }
      - { name: descrizione, label: Descrizione breve, description: "Massimo 400 caratteri.", type: text, required: true }
      - { name: bozza, label: Bozza (non pubblicare ancora), type: boolean, default: false }
      - { name: body, label: Testo (facoltativo), type: rich-text }

  - name: notizie
    label: Notizie e normativa
    type: collection
    path: src/content/notizie
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [titolo, data, bozza]
      primary: titolo
      sort: [data, titolo]
      default: { sort: data, order: desc }
    fields:
      - { name: titolo, label: Titolo, type: string, required: true }
      - { name: data, label: Data, type: date, required: true }
      - { name: sommario, label: Sommario, description: "Due righe che compaiono nell'elenco e su Google (max 300 caratteri).", type: text, required: true }
      - { name: video, label: Video YouTube (facoltativo), description: "Incolla il link del video, es. https://www.youtube.com/watch?v=...", type: string }
      - name: immagine
        label: Immagine (facoltativa)
        type: object
        fields:
          - { name: src, label: Immagine, type: image, options: { media: notizie } }
          - { name: alt, label: Cosa si vede nell'immagine, type: string }
      - { name: tag, label: Etichette, type: string, list: true }
      - { name: bozza, label: Bozza (non pubblicare ancora), type: boolean, default: false }
      - { name: body, label: Testo dell'articolo, type: rich-text, required: true }

  - name: pagine
    label: Testi delle pagine
    description: Testi delle pagine servizio. Le pagine non si aggiungono né si cancellano da qui.
    type: collection
    path: src/content/pagine
    format: yaml-frontmatter
    operations: { create: false, delete: false, rename: false }
    view:
      fields: [titolo]
      primary: titolo
    fields:
      - { name: titolo, label: Titolo, type: string, required: true }
      - { name: metaTitolo, label: Titolo per Google (facoltativo), description: "Max 60 caratteri.", type: string }
      - { name: metaDescrizione, label: Descrizione per Google, description: "Max 160 caratteri.", type: text, required: true }
      - { name: intro, label: Introduzione, type: text, required: true }
      - name: punti
        label: Punti principali
        type: object
        list: true
        fields:
          - { name: titolo, label: Titolo, type: string }
          - { name: testo, label: Testo, type: text }
      - name: fasi
        label: Fasi della pratica
        type: object
        list: true
        fields:
          - { name: titolo, label: Titolo, type: string }
          - { name: testo, label: Testo, type: text }
      - name: faq
        label: Domande frequenti
        type: object
        list: true
        fields:
          - { name: domanda, label: Domanda, type: string }
          - { name: risposta, label: Risposta, type: text }
      - { name: body, label: Approfondimento (facoltativo), type: rich-text }

  - name: contatti
    label: Contatti
    type: file
    path: src/content/settings/contatti.json
    format: json
    fields:
      - { name: telefono, label: Telefono, type: string, required: true }
      - { name: whatsapp, label: WhatsApp, description: "Numero con prefisso, es. +39 333 1234567", type: string, required: true }
      - { name: email, label: Email pubblica, type: string, required: true }
      - { name: orari, label: Orari, type: string }
      - { name: citta, label: Città dello studio, type: string }
      - { name: partitaIva, label: Partita IVA, type: string }
      - { name: instagram, label: Link Instagram, type: string }
